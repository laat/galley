name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

# A newer push to a pull request cancels its run. Every push to main gets a group of its own:
# a group keeps one run pending and cancels the one before it, even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The required check for auto-merge: keep the job name.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # package.json has no packageManager; this is the pnpm that wrote pnpm-lock.yaml.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The install sandbox's tests run bubblewrap, which needs unprivileged user namespaces;
      # Ubuntu restricts them with AppArmor. The last command fails the job when bwrap still can
      # not make a sandbox, rather than let those tests skip.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --share-net --ro-bind / / --dev /dev --proc /proc true
      # The tests run git, ssh-keygen and jq, which the runner image has. They bring their
      # own git config, gh, codex and claude.
      - run: pnpm test
