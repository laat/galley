name: release

# Stages galley-proof on npm when a GitHub Release is published (.claude/skills/release/SKILL.md),
# from the release's tag. A tag pushed without a release stages nothing. A staged version is on
# npm, but nobody can install it until the user approves it with 2FA (`npm stage approve`).
#
# npm's trusted publishing: npm takes this workflow's OIDC token, for the trusted publisher set up
# on npmjs.com (owner laat, repository galley, workflow release.yml), in place of a token in the
# repository, and adds provenance. The trusted publisher allows `npm stage publish` only, so the
# workflow can not publish on its own. Only the stage job can ask for that token, and it installs
# no dependencies and runs no tests.
on:
  release:
    types: [published]

permissions: {}

# One release at a time, and none cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The release's tag against package.json and npm, and the package as npm installs it.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release's tag is $TAG, but package.json's version is $version. Bump package.json in a pull request and release that, or name the release's tag v$version."
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          if [ "$PRERELEASE" != "$prerelease" ]; then
            echo "::error::A release is a pre-release on GitHub exactly when its version is one (0.3.0-rc.1). $TAG is marked prerelease=$PRERELEASE."
            exit 1
          fi
          if npm view "$name@$version" version 2>"$RUNNER_TEMP/npm-view.log"; then
            echo "::error::$name $version is already on npm. Bump package.json's version in a pull request, and release that."
            exit 1
          elif ! grep -q E404 "$RUNNER_TEMP/npm-view.log"; then
            cat "$RUNNER_TEMP/npm-view.log"
            echo "::error::Could not ask npm whether $name $version is published."
            exit 1
          fi
      # Installed from its tarball, as npm installs it: Node strips types from no file under
      # node_modules, so a module the build left out or left as .ts fails here. No install scripts:
      # galley has none, and its dependencies need none.
      - name: Install the package
        run: |
          npm run build
          npm pack ./dist --pack-destination "$RUNNER_TEMP"
          npm install --global --ignore-scripts --prefix "$RUNNER_TEMP/global" "$RUNNER_TEMP"/galley-proof-*.tgz
          got=$("$RUNNER_TEMP/global/bin/galley" --version)
          want="galley version $(node -p "require('./package.json').version")"
          if [ "$got" != "$want" ]; then
            echo "::error::The installed galley --version says \"$got\", not \"$want\"."
            exit 1
          fi

  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  stage:
    name: stage
    needs: [package, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # `npm stage`, with trusted publishing, needs npm 11.15.0 or newer.
      - name: Update npm
        run: |
          if node -e 'process.exit(process.argv[1].localeCompare("11.15.0", undefined, { numeric: true }) < 0 ? 0 : 1)' "$(npm --version)"; then
            npm install --global npm@^11.15.0
          fi
          npm --version
      # The build needs nothing but Node (scripts/build.ts).
      - run: npm run build
      # A pre-release goes to npm's next, so that `npm install galley-proof` keeps getting the last release.
      # npm refuses to stage a version it has staged already. The job can not ask first with
      # `npm stage list`, which needs a login: npm's OIDC token runs `npm stage publish`, but not
      # the other `npm stage` commands.
      - name: Stage
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          npm stage publish ./dist --access public --tag "$tag" --json >"$RUNNER_TEMP/stage.json"
          cat "$RUNNER_TEMP/stage.json"
          staged() { node -p "Object.values(require(process.argv[1]))[0].$1 ?? ''" "$RUNNER_TEMP/stage.json"; }
          id=$(staged stageId)
          if [ -z "$id" ]; then
            echo "::error::npm staged $name $version without saying its stage id. npm stage list $name has it."
            exit 1
          fi
          echo "::notice::Staged $name@$version as $id: approve with npm stage approve $id"
          {
            echo "Staged $name@$version as \`$id\`, with the dist-tag \`$tag\` and the shasum \`$(staged shasum)\`."
            echo
            echo "Nobody can install it until it is approved: approve with \`npm stage approve $id\`, or reject it with \`npm stage reject $id\`. Both ask for 2FA."
          } >>"$GITHUB_STEP_SUMMARY"
